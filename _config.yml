# ── Site metadata ─────────────────────────────────────────────────
title: "Onunga Elly — Software Developer"
description: >-
  Software developer and student building edtech and SaaS products
  for the East African market. GilaniAI · Gilani ERP · Shulio.
url: "https://justolise.github.io"
baseurl: "/elly"
author: "Onunga Elly"
email: "onungaelly@gmail.com"
github_username: justolise

# ── Theme ─────────────────────────────────────────────────────────
# Cayman is a clean GitHub-hosted theme; it won't override index.html
# because that file has no Jekyll front matter (--- blocks).
# It does style any future .md pages you add.
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme

# ── Build settings ────────────────────────────────────────────────
# Tell Jekyll to leave our existing HTML/CSS/JS exactly as-is.
include:
  - index.html
  - styles.css
  - main.js

exclude:
  - "*.sh"
  - "node_modules/"
  - ".git/"

# ── SEO / social ──────────────────────────────────────────────────
lang: en
timezone: Africa/Nairobi
